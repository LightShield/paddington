[pytest]
markers =
    unit: Unit tests (fast, no I/O, use mocks)
    integration: Integration tests (slow, with I/O, use real tools)
    e2e: End-to-end tests (slowest, full workflows)

addopts = --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
